name: Deploy to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read

env:
  DOTNET_VERSION: '9.0.x'
  AZURE_WEBAPP_NAME: 'WaterMe'
  AZURE_RESOURCE_GROUP: 'rg-waterme-prod'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Verify health check
        run: |
          sleep 30
          curl --fail --silent --show-error \
            "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/healthz"
        continue-on-error: true   # Safety net for first deploy only — remove after first success
